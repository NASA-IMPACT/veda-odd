name: Update Reports

on:
  schedule:
    # Run every Monday at 9 AM ET (14:00 UTC)
    - cron: '0 14 * * 1'
  workflow_dispatch:

jobs:
  reports:
    uses: NASA-IMPACT/dse-oss-reports/.github/workflows/reports.yml@91207ebbca41cfeebe261f558b5ad10704148c1f  # v0.5.1
    permissions:
      contents: write
      pull-requests: write
    with:
      dse-oss-reports-ref: 91207ebbca41cfeebe261f558b5ad10704148c1f  # v0.5.1
    secrets:
      pat: ${{ secrets.GH_ODD_PAT }}
